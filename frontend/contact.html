<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Products in Pakistan | Sonic Master</title>
<!--=====WEB-ICON====-->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png"> 
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png"> 
    <link rel="manifest" href="favicon_io/site.webmanifest">
    
    <link rel="stylesheet" href="css/style.css">
</head> 

<body>

<!-- ===================== HEADER ===================== -->
<header class="main-header">

    <!-- MENU BUTTON -->
    <div class="menu-btn" id="menuBtn">☰</div>

    <!-- LOGO -->
    <div class="logo-container">
        <a href="index.html">
            <svg class="site-logo" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 400 60">

            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <rect width="400" height="60" fill="transparent"/>

            <text x="15" y="40"
            font-family="Tahoma, Arial, sans-serif"
            font-size="50"
            font-weight="bold"
            fill="#ff3b00"
            filter="url(#glow)">
            Sonic
            <animate attributeName="fill"
                values="#ff3b00;#ff6a00;#ff1a00;#ff3b00"
                dur="0.3s"
                repeatCount="indefinite"/>
            </text>

            <text x="160" y="40"
            font-family="Tahoma, Arial, sans-serif"
            font-size="40"
            font-weight="bold"
            fill="#1E90FF"
            filter="url(#glow)">
            Master
            <animate attributeName="fill"
                values="#1E90FF;#00c3ff;#0066ff;#1E90FF"
                dur="1.2s"
                repeatCount="indefinite"/>
            </text>

            </svg>
        </a>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
        <input type="text" placeholder="Search products...">
    </div>

    <!-- RIGHT SIDE -->
    <div class="header-right">
        <a href="index.html" >Home</a>
        <a href="contact.html" style="color:#33e414;">Contact</a>

        <div class="cart-icon" id="cartIcon">
            🛒 <span id="cartCount">0</span>
        </div>
    </div>

</header>

<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
    <button id="closeMenu">✖</button>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>

    <!-- ================= CATEGORY FILTER ================= -->
<section class="categories">
    <button class="category-btn" data-category="All">All</button>
    <button class="category-btn" data-category="Electronics">Electronics</button>
    <button class="category-btn" data-category="Beauty">Beauty</button>
    <button class="category-btn" data-category="Home">Home</button>
    <button class="category-btn" data-category="Sales">Sales</button>
    <button class="category-btn" data-category="New Incomings">New Inncomings</button>
    <button class="category-btn" data-category="Login">Login</button>

</section>

</div>

<!-- CONTACT SECTION -->
<section class="contact-section">

    <!-- LEFT SIDE -->
    <div class="contact-left">
        <h2>Get In Touch</h2>
        <p>
            Have questions about our premium accessories?<br>
            We're here to help you with orders, 
            and product inquiries.
        </p>

        <div class="contact-info">
            <strong>Email:</strong> syedabdulsamadshah8@gmail.com
        </div>

        <div class="contact-info">
            <strong>Phone:</strong> +92 319 9210663
        </div>

        <div class="contact-info">
            <strong>Location:</strong> Pakistan
        </div>
    </div>

    <!-- RIGHT SIDE (FORM) -->
    <div class="contact-right">
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

</section>

</body>
</html>
